name: Hourly reminders

# Le plan Vercel Hobby n'autorise que des cron jobs quotidiens (une fois par
# jour max) — impossible d'y déclencher une vérification toutes les 15
# minutes pour respecter l'horaire (heure + minute) choisi par chaque
# utilisateur. On utilise donc GitHub Actions (gratuit, sans cette limite)
# pour appeler les mêmes routes API à la place du cron Vercel.
# GitHub ne garantit pas la minute exacte (jusqu'à quelques minutes de
# retard possible), mais la fréquence reste 1x/15min.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Morning motivation
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://suivie-sport.vercel.app/api/cron/morning-motivation
      - name: Supplement reminder
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://suivie-sport.vercel.app/api/cron/supplement-reminder
